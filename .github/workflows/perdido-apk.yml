name: Perdido - build APK

on:
  push:
    paths:
      - 'undertale-mobile/**'
      - '.github/workflows/perdido-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: undertale-mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Perdido-APK
          path: undertale-mobile/android/app/build/outputs/apk/release/app-release.apk
