plugins {
    id 'com.android.application'
}

android {
    namespace 'com.heitorcoser.perdido'
    compileSdk 35

    defaultConfig {
        applicationId 'com.heitorcoser.perdido'
        minSdk 24
        targetSdk 35
        versionCode 19
        versionName '2.0.0'
    }

    // Chave própria do projeto: assim qualquer build (local ou GitHub Actions)
    // gera um APK que atualiza o anterior sem precisar desinstalar.
    signingConfigs {
        perdido {
            storeFile file('perdido.keystore')
            storePassword 'perdido123'
            keyAlias 'perdido'
            keyPassword 'perdido123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.perdido
        }
        debug {
            signingConfig signingConfigs.perdido
        }
    }

    // O jogo (HTML5) fica em ../../www e entra direto como assets do APK.
    sourceSets {
        main.assets.srcDirs = ['../../www']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
