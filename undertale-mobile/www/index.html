<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>PERDIDO — jogue no navegador | Losters</title>
<meta name="description" content="Jogue PERDIDO no navegador: um RPG em pixel art inspirado em Undertale e Deltarune.">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  @font-face { font-family: "VT323"; src: url(fonts/vt323.woff2) format("woff2"); }
  @font-face { font-family: "PressStart"; src: url(fonts/pressstart2p.woff2) format("woff2"); }
  :root { --btn: rgba(255,255,255,0.10); --btn-on: rgba(255,255,255,0.28); --line: rgba(255,255,255,0.35); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #wrap { position: relative; flex: 0 1 auto; aspect-ratio: 4 / 3; height: min(100vh, calc((100vw - 340px) * 0.75)); max-width: 100%; }
  #game { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  .side { flex: 0 0 160px; height: 100%; display: flex; align-items: center; justify-content: center; }
  #dpad { position: relative; width: 150px; height: 150px; border-radius: 50%; background: var(--btn); border: 2px solid var(--line); touch-action: none; }
  #dpad::before, #dpad::after { content: ""; position: absolute; background: rgba(255,255,255,0.18); border-radius: 6px; }
  #dpad::before { left: 50%; top: 14%; width: 44px; height: 72%; transform: translateX(-50%); }
  #dpad::after { top: 50%; left: 14%; height: 44px; width: 72%; transform: translateY(-50%); }
  #dpad span { position: absolute; color: rgba(255,255,255,0.7); font: 20px "PressStart", monospace; z-index: 1; pointer-events: none; }
  #dpad .u { left: 50%; top: 10%; transform: translateX(-50%); } #dpad .d { left: 50%; bottom: 10%; transform: translateX(-50%); }
  #dpad .l { top: 50%; left: 10%; transform: translateY(-50%); } #dpad .r { top: 50%; right: 10%; transform: translateY(-50%); }
  #stick { position: relative; width: 150px; height: 150px; border-radius: 50%; touch-action: none;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0 55%, rgba(255,255,255,0.12) 56% 100%); border: 2px solid var(--line); }
  #knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.55), rgba(255,255,255,0.22)); border: 2px solid rgba(255,255,255,0.6);
    pointer-events: none; transition: transform 0.05s; }
  body[data-control="analog"] #dpad, body:not([data-control]) #dpad { display: none; }
  body[data-control="dpad"] #stick { display: none; }
  .ab { display: flex; flex-direction: column; gap: 22px; align-items: center; }
  .ab div { width: 78px; height: 78px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font: 22px "PressStart", monospace; color: #fff; background: var(--btn); border: 2px solid var(--line); touch-action: none; }
  .ab .a { border-color: #ffd23a; color: #ffd23a; transform: translateX(-22px); }
  .ab .b { border-color: #ff7f27; color: #ff7f27; transform: translateX(22px); }
  .ab div.on { background: var(--btn-on); }
  @media (orientation: portrait) {
    body { flex-direction: column; justify-content: flex-start; gap: 18px; padding-top: max(16px, env(safe-area-inset-top)); }
    #wrap { width: 100vw; height: auto; }
    .controls { display: flex; width: 100%; justify-content: space-around; align-items: center; }
    .side { height: auto; }
  }
  @media (orientation: landscape) { .controls { display: contents; } #left { order: 0; } #wrap { order: 1; } #right { order: 2; } }
  /* PC: sem botões na tela, jogo ocupando a janela toda */
  body.desktop .controls { display: none; }
  body.desktop #wrap { height: min(100vh, 100vw * 0.75); }
  /* multiplayer */
  #coopVideo { position: absolute; inset: 0; width: 100%; height: 100%; display: none; background: #000; image-rendering: pixelated; object-fit: contain; }
  body.guest #coopVideo { display: block; }
  body.guest #game { visibility: hidden; }
  #coop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.78); z-index: 10; }
  #coop.show { display: flex; }
  #coop .box { width: min(92vw, 460px); max-height: 94vh; overflow: auto; background: #000; border: 4px solid #fff; padding: 16px 18px; color: #fff; font: 22px "VT323", monospace; user-select: text; -webkit-user-select: text; }
  #coop h2 { margin: 0 0 8px; font: 18px "PressStart", monospace; text-align: center; color: #ffe680; }
  #coop p { margin: 8px 0; } #coop .small { font-size: 19px; color: #c8c8d4; } #coop .status { color: #ff9a9a; }
  #coop .code { font: 34px "PressStart", monospace; text-align: center; letter-spacing: 6px; color: #5ff8ff; margin: 6px 0 10px; }
  #coop ul { margin: 4px 0 10px; padding-left: 22px; }
  #coop label { display: block; margin: 8px 0; }
  #coop input { width: 100%; font: 24px "VT323", monospace; padding: 6px 8px; background: #111; color: #fff; border: 2px solid #888; margin-top: 4px; }
  #coop button { display: block; width: 100%; margin: 8px 0; padding: 10px; font: 16px "PressStart", monospace; background: #000; color: #ffe680; border: 3px solid #ffe680; cursor: pointer; }
  #coop button.sec { color: #ff9a6a; border-color: #ff9a6a; }
  #coop .row { display: flex; gap: 8px; align-items: center; } #coop .row input { margin: 0; } #coop .row button { width: auto; margin: 0; white-space: nowrap; }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="640" height="480"></canvas><video id="coopVideo" autoplay muted playsinline></video></div>
  <div id="coop"><div class="box"><h2>MULTIPLAYER</h2><div id="coopBody"></div></div></div>
  <div class="controls">
    <div class="side" id="left">
      <div id="stick"><div id="knob"></div></div>
      <div id="dpad"><span class="u">▲</span><span class="d">▼</span><span class="l">◀</span><span class="r">▶</span></div>
    </div>
    <div class="side" id="right">
      <div class="ab"><div class="a" data-key="a">A</div><div class="b" data-key="b">B</div></div>
    </div>
  </div>
  <script src="lib/peerjs.min.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/sprites2.js"></script>
  <script src="js/sprites3.js"></script>
  <script src="js/sprites4.js"></script>
  <script src="js/sprites5.js"></script>
  <script src="js/sprites6.js"></script>
  <script src="js/sprites7.js"></script>
  <script src="js/sprites8.js"></script>
  <script src="js/sprites9.js"></script>
  <script src="js/sprites10.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/world.js"></script>
  <script src="js/phase1.js"></script>
  <script src="js/phase2.js"></script>
  <script src="js/phase3.js"></script>
  <script src="js/phase4.js"></script>
  <script src="js/phase5.js"></script>
  <script src="js/phase6.js"></script>
  <script src="js/phase7.js"></script>
  <script src="js/phase8.js"></script>
  <script src="js/boss9.js"></script>
  <script src="js/phase9.js"></script>
  <script src="js/phase10.js"></script>
  <script src="js/phase11.js"></script>
  <script src="js/phase12.js"></script>
  <script src="js/phase13.js"></script>
  <script src="js/phase14.js"></script>
  <script src="js/quests.js"></script>
  <script src="js/coop.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cap2.js"></script>
  <script src="js/c2fase1.js"></script>
  <script src="js/c2fase2.js"></script>
  <script src="js/c2fase3.js"></script>
</body>
</html>
